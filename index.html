<script>
  // Theme before first paint (the server puts the saved choice on <html data-theme-choice>).
  (function () { var d = document.documentElement, c = d.dataset.themeChoice || "system";
    d.dataset.theme = c === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : c; })();
</script>
</head>

<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
